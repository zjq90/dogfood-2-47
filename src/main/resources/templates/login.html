<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 商城管理系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .login-container {
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }
        
        .login-card {
            background: white;
            border-radius: 1rem;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        
        .login-header {
            background: linear-gradient(135deg, #4e73df 0%, #224abe 100%);
            color: white;
            padding: 2.5rem 2rem;
            text-align: center;
        }
        
        .login-header h3 {
            margin: 0;
            font-weight: 600;
        }
        
        .login-header p {
            margin: 0.5rem 0 0 0;
            opacity: 0.9;
        }
        
        .login-body {
            padding: 2rem;
        }
        
        .form-floating {
            margin-bottom: 1rem;
        }
        
        .form-floating > .form-control {
            border-radius: 0.5rem;
        }
        
        .form-floating > label {
            color: #6c757d;
        }
        
        .btn-login {
            width: 100%;
            padding: 0.8rem;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 0.5rem;
            background: linear-gradient(135deg, #4e73df 0%, #224abe 100%);
            border: none;
            transition: all 0.3s;
        }
        
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(78, 115, 223, 0.4);
        }
        
        .input-group-text {
            background: transparent;
            border-right: none;
        }
        
        .form-control.with-icon {
            border-left: none;
        }
        
        .alert {
            border-radius: 0.5rem;
        }
        
        .login-footer {
            text-align: center;
            padding: 1rem 2rem 2rem;
            color: #6c757d;
        }
        
        .spinner-border {
            width: 1.2rem;
            height: 1.2rem;
            margin-right: 0.5rem;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <i class="bi bi-shop fs-1 mb-2"></i>
                <h3>商城管理系统</h3>
                <p>欢迎回来，请登录您的账号</p>
            </div>
            <div class="login-body">
                <div id="alertBox" class="alert alert-danger d-none" role="alert"></div>
                
                <form id="loginForm">
                    <div class="form-floating">
                        <input type="text" class="form-control" id="username" name="username" placeholder="用户名" required>
                        <label for="username"><i class="bi bi-person me-2"></i>用户名</label>
                    </div>
                    
                    <div class="form-floating">
                        <input type="password" class="form-control" id="password" name="password" placeholder="密码" required>
                        <label for="password"><i class="bi bi-lock me-2"></i>密码</label>
                    </div>
                    
                    <div class="form-check mb-3">
                        <input class="form-check-input" type="checkbox" id="remember">
                        <label class="form-check-label" for="remember">
                            记住我
                        </label>
                    </div>
                    
                    <button type="submit" class="btn btn-primary btn-login" id="loginBtn">
                        <span class="spinner-border d-none" id="loading"></span>
                        <span id="btnText">登 录</span>
                    </button>
                </form>
            </div>
            <div class="login-footer">
                <small>默认账号: admin / 密码: admin123</small>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script>
        $(document).ready(function() {
            $('#loginForm').on('submit', function(e) {
                e.preventDefault();
                
                const username = $('#username').val().trim();
                const password = $('#password').val().trim();
                
                if (!username || !password) {
                    showAlert('请输入用户名和密码');
                    return;
                }
                
                $('#loading').removeClass('d-none');
                $('#btnText').text('登录中...');
                $('#loginBtn').prop('disabled', true);
                
                $.ajax({
                    url: '/doLogin',
                    type: 'POST',
                    data: {
                        username: username,
                        password: password
                    },
                    success: function(res) {
                        if (res.code === 200) {
                            window.location.href = '/dashboard';
                        } else {
                            showAlert(res.message);
                            resetBtn();
                        }
                    },
                    error: function() {
                        showAlert('登录失败，请稍后重试');
                        resetBtn();
                    }
                });
            });
            
            function showAlert(message) {
                $('#alertBox').text(message).removeClass('d-none');
                setTimeout(() => $('#alertBox').addClass('d-none'), 5000);
            }
            
            function resetBtn() {
                $('#loading').addClass('d-none');
                $('#btnText').text('登 录');
                $('#loginBtn').prop('disabled', false);
            }
        });
    </script>
</body>
</html>
